name: CI

on:
  workflow_call: {}
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run locked local validation
        run: bash scripts/ci.sh
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: 'Export coverage: python'
        id: export_coverage_python
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-python-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
  integration:
    name: Integration Tests
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    # NOTE: integration-tests/.github/workflows/integration.yml has workflow_call but
    # assumes sibling repo layout (../inverter-dashboard). We implement the pattern
    # locally instead of workflow_call.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout integration-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/integration-tests
          # Includes fix for test_websocket_connection infinite-recv timeout
          # (victron-venus/integration-tests#90).
          ref: 9c4f97e3229c0b0db50939d3a2301db9260c9036
          path: integration-tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        run: |
          # Context must be integration-tests/ so COPY tests works. This repo's
          # .dockerignore excludes tests/ (keeps the production build lean), and
          # context "." would also copy the wrong tests/ (unit tests).
          docker build \
            -f integration-tests/Dockerfile.test-runner \
            -t test-runner \
            integration-tests

      - name: Start test stack
        working-directory: integration-tests
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d --build mqtt-broker mock-dbus mock-battery mock-pv
          sleep 5

      - name: Build dashboard test image
        run: |
          # Nested checkout cannot satisfy compose's sibling ../inverter-dashboard
          # + Dockerfile.test. Build this repo's production Dockerfile, then start
          # via the CI override (HOST=0.0.0.0, mqtt-broker command).
          docker build -t dashboard-python -f Dockerfile .
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            up -d dashboard-python
          sleep 10

      - name: Run integration tests
        run: |
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            run --rm \
            -e DASHBOARD_URL=ws://dashboard-python:8080/ws \
            -e MQTT_HOST=mqtt-broker \
            -e MQTT_PORT=1883 \
            test-runner python -m pytest tests/ -v --tb=short

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-report
          path: report.html
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose \
            --project-directory integration-tests \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            -f "$GITHUB_WORKSPACE/.github/compose.integration.override.yml" \
            down -v
    timeout-minutes: 30
