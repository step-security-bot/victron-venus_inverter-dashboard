version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "docker"
    # Lock python base image updates: bare-digest bumps floated from Alpine to
    # Debian and broke apk (PRs #92, #104). The Dockerfile pins an Alpine
    # digest (see its header comment); bump it manually from the
    # `python:3.14-alpine` tag only.
    ignore:
      - dependency-name: "python"
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
