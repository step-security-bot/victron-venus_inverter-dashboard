[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-dashboard"
version = "0.0.0"  # read from VERSION at runtime
description = "Remote web dashboard for Victron Cerbo GX inverter control"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
    "aiomqtt>=2.0.0",
    "msgpack>=1.2.1",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "pydantic-settings>=2.0",
    "pywebpush==2.5.0",
    "aiohttp>=3.14.4",
    "cryptography>=50.0.1",
    "py-vapid>=1.9.4",
    "http-ece==1.2.1",
]

[project.scripts]
inverter-dashboard = "inverter_dashboard.server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "trustme>=1.2",
]

[dependency-groups]
packaging = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# static/ holds the Vue SPA (flat layout from docker-publish, or static/dist from export_dist.sh)
inverter_dashboard = ["VERSION", "static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pylint.messages_control]
disable = [
    "E0401",  # Unable to import (system libs not in venv)
    "C0103",  # Invalid name (legacy naming conventions)
    "C0301",  # Line too long
    "W1203",  # f-string logging (style preference)
    "R0902",  # Too many instance attributes
    "R0903",  # Too few public methods
    "R0914",  # Too many local variables
    "R0915",  # Too many statements
    "C0116",  # Missing function docstring
    "C0413",  # Wrong import position
    "W0718",  # Catching general Exception
    "W0613",  # Unused argument
    "W0603",  # global-statement: load_config() deliberately populates module-level config caches
    "R0912",  # Too many branches (MqttState.on_message topic dispatch)
    "R0913",  # Too many arguments (cerbo_owns_key flag bag)
    "C0415",  # import-outside-toplevel: local_config is imported lazily at runtime
    "W0621",  # redefined-outer-name: pytest fixtures are injected as same-named args
    "W0212",  # protected-access: unit tests exercise internal helpers
    "W0404",  # Reimport: tests re-import TestClient per method (convention)
    "C1803",  # Simplifiable comparison to literal (already handled in test code)
    "R0801",  # Duplicate code: test fixtures mirror production shape
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E722",   # Do not use bare except
    "F841",   # Local variable assigned but never used
    "BLE001", # Blind `except Exception` — deliberate log-and-continue on network paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.uv.sources]
http-ece = { path = "vendor/http-ece/http_ece-1.2.1-py2.py3-none-any.whl" }
