apiVersion: apps/v1
kind: Deployment
metadata:
  name: inverter-dashboard
  labels:
    app: inverter-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inverter-dashboard
  template:
    metadata:
      labels:
        app: inverter-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      containers:
        - name: dashboard
          image: alvit/inverter-dashboard:latest
          imagePullPolicy: Always
          # Override Docker's legacy --mqtt-host Cerbo default; respect MQTT_HOST from env.
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inverter-dashboard
            - secretRef:
                name: inverter-dashboard-gateway
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: inverter-dashboard-config
