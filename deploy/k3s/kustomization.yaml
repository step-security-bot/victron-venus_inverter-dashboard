apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inverter-dashboard
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  # 02-secret.example.yaml is EXAMPLE ONLY — apply real Secrets out-of-band
  # (inverter-dashboard-config + inverter-dashboard-gateway). Never include it
  # in kustomize resources or `kubectl apply -k` will overwrite production.
  - 03-deployment.yaml
  - 04-service.yaml
  - 05-ingress.yaml
images:
  - name: alvit/inverter-dashboard
    # Set the registry hostname in the ignored local copy before applying.
    newName: registry.example.invalid/inverter-dashboard
    digest: sha256:2224fdb1fb02ec31af99ae4be608f784b42c81ed8b6561bff21d95beb329635b
